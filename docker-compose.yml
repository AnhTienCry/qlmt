# =============================================
# QLMT - Docker Compose Configuration
# =============================================
# Chạy: docker-compose up -d --build
# Dừng: docker-compose down
# Xem logs: docker-compose logs -f
# =============================================

version: '3.8'

services:
  # =============================================
  # SQL Server Database
  # =============================================
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: qlmt-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=QlmtPassword123!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./backend/src/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "QlmtPassword123!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # =============================================
  # Database Initialization
  # =============================================
  db-init:
    image: mcr.microsoft.com/mssql-tools:latest
    container_name: qlmt-db-init
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src/database/init.sql:/init.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for SQL Server to be ready..."
        sleep 10
        echo "Running database initialization script..."
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "QlmtPassword123!" -C -i /init.sql
        echo "Database initialization completed!"

  # =============================================
  # Backend API (Node.js + Express)
  # =============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qlmt-backend
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_SERVER=db
      - DB_PORT=1433
      - DB_DATABASE=QuanLyMayTinhDB
      - DB_USER=sa
      - DB_PASSWORD=QlmtPassword123!
      - DB_ENCRYPT=false
      - DB_TRUST_SERVER_CERTIFICATE=true
      - JWT_SECRET=qlmt_docker_jwt_secret_key_2026
      - JWT_EXPIRES_IN=7d
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =============================================
  # Frontend (React + Nginx)
  # =============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qlmt-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlserver_data:
    driver: local
